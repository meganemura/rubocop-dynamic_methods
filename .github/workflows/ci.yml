name: CI

on:
  push:
    branches:
      - main
      - queue
  pull_request:
  # release.yml runs the same jobs on the commit it releases.
  workflow_call:

permissions:
  contents: read

# Actions are pinned to a commit. A tag can be moved to another commit.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: [ "3.4", "4.0" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec bin/test

  # The generated signatures match the comments in lib/, and lib/ checks
  # against them.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rbs-inline --output=sig/generated lib
      - run: git add --intent-to-add sig && git diff --exit-code sig
      - name: Check the types
        run: |
          # Steep logs FATAL or ERROR and skips the rest of a method when it
          # cannot type a node, and still prints "No type error detected".
          set -o pipefail
          bundle exec steep check 2>&1 | tee steep.log
          if grep -E ': (FATAL|ERROR): \[Steep' steep.log; then
            echo "Steep stopped checking the code on the lines above." >&2
            exit 1
          fi

  # hegeltest needs Ruby 3.4 and steep needs Ruby 3.3, so the oldest
  # supported Ruby runs the example tests only.
  oldest:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: hegel:types
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - run: bundle exec bin/test test/cops_test.rb
